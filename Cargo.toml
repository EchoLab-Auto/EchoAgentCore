[workspace]
resolver = "2"
members = [
    "source/defs/echo-defs",
    "source/context/echo-bootstrap",
    "source/session/echo-session",
    "source/tool/echo-tool",
    "source/shell/echo-shell",
    "source/loop/echo-loop",
    "source/llm/echo-llm-openai",
    "source/llm/echo-llm-anthropic",
    "source/llm/echo-llm-ollama",
    "source/security/echo-sanitize",
    "source/protocol/echo-protocol",
    "source/federation/echo-federation",
    "source/backend/echo-agent",
    "source/config/echo-config",
    "source/backend/echo-test-utils",
    "source/core",
    "source/plugin/echo-plugin-adapter",
    "source/plugin/echo-plugin-example",
    "source/plugin/echo-plugin-provider-llm",
    "source/plugin/echo-plugin-skills",
    "source/plugin/echo-plugin-loop",
    "source/plugin/echo-plugin-subagent",
    "source/plugin/echo-plugin-workspace",
    "source/plugin/echo-plugin-management",
    "source/plugin/echo-plugin-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/EchoAgentCore"

# Faster test builds (cheap to compile, noticeably faster test runs).
[profile.test]
opt-level = 1

# Release 产物体积（2026-10 实测）。
#
# 基线：`target/release/echo-agent-core` = 24,910,840 B（23.76 MiB）。其中
# `.text` 13.3 MiB（代码本体），其余 ~10.4 MiB 主要是 **`.symtab`/`.strtab`
# 符号表**——release 默认 `debug = 0` 本就不产生 `.debug_*`，所以"剥调试信息"
# 几乎无效（实测 `strip --strip-debug` 只省 840 KB ≈ 3%）。
#
# 实测三档（同一二进制上直接跑 strip 验证）：
#   strip = "none"       24,910,840 B  23.76 MiB   （带符号表）
#   strip = "debuginfo"  24,070,520 B  22.96 MiB   （-0.8 MiB，几乎无用）
#   strip = "symbols"    18,394,632 B  17.54 MiB   （-6.5 MiB，-26.2% ← 采用）
#
# 选 `symbols`：安装器与自更新每次都要复制 + 滚动备份该二进制
# （`~/.local/libexec/echo-agent-core/echo-agent-core-bin` 与 `.bak-*`），
# 6.5 MiB 的差额在每次更新时都白付；updater 的下载/替换也更快。
#
# 代价与补偿（重要）：
# - panic 的 **消息与源码位置仍在**（`panic!` 的 file:line 是 `.rodata` 里的
#   字符串，不受影响），丢的是 backtrace 里的**函数名**（只剩地址）；
# - 需要函数名排障时，用下面这行临时重建一个带符号的二进制即可（不进仓库）：
#     cargo build --release -p echo-agent-core \
#       --config 'profile.release.strip="none"'
# - 不引入 LTO / codegen-units=1：updater 每次都要跑 `cargo build --release`，
#   加 LTO 会把每次更新拉长数分钟，与体积收益不划算。
[profile.release]
strip = "symbols"

[workspace.dependencies]
echo-defs = { path = "source/defs/echo-defs" }
echo-config = { path = "source/config/echo-config" }
echo-context = { git = "https://github.com/EchoLab-Auto/plugin-framework", tag = "v0.4.1" }
echo-bootstrap = { path = "source/context/echo-bootstrap" }
echo-sanitize = { path = "source/security/echo-sanitize" }
echo-session = { path = "source/session/echo-session" }
echo-tool = { path = "source/tool/echo-tool" }
echo-shell = { path = "source/shell/echo-shell" }
echo-loop = { path = "source/loop/echo-loop" }
echo-llm-openai = { path = "source/llm/echo-llm-openai" }
echo-llm-anthropic = { path = "source/llm/echo-llm-anthropic" }
echo-llm-ollama = { path = "source/llm/echo-llm-ollama" }
echo-protocol = { path = "source/protocol/echo-protocol" }
echo-agent = { path = "source/backend/echo-agent" }
echo-test-utils = { path = "source/backend/echo-test-utils" }
echo-plugin = { git = "https://github.com/EchoLab-Auto/plugin-framework", tag = "v0.4.1" }
echo-plugin-api = { git = "https://github.com/EchoLab-Auto/plugin-framework", tag = "v0.4.1" }
echo-plugin-host = { git = "https://github.com/EchoLab-Auto/plugin-framework", tag = "v0.4.1" }
echo-plugin-adapter = { path = "source/plugin/echo-plugin-adapter" }
echo-plugin-sdk = { git = "https://github.com/EchoLab-Auto/plugin-framework", tag = "v0.4.1" }
echo-plugin-example = { path = "source/plugin/echo-plugin-example" }
echo-plugin-loader = { git = "https://github.com/EchoLab-Auto/plugin-framework", tag = "v0.4.1" }
echo-plugin-provider-llm = { path = "source/plugin/echo-plugin-provider-llm" }
echo-plugin-skills = { path = "source/plugin/echo-plugin-skills" }
echo-plugin-loop = { path = "source/plugin/echo-plugin-loop" }
echo-plugin-subagent = { path = "source/plugin/echo-plugin-subagent" }
echo-plugin-workspace = { path = "source/plugin/echo-plugin-workspace" }
echo-plugin-management = { path = "source/plugin/echo-plugin-management" }
echo-plugin-tools = { path = "source/plugin/echo-plugin-tools" }
echo-federation = { path = "source/federation/echo-federation" }

# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# config
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# concurrency / misc
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# agent framework
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"
walkdir = "2"
regex = "1"
aho-corasick = "1"
