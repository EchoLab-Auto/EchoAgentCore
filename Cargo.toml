[workspace]
resolver = "2"
members = [
    "source/modules/echo-defs",
    "source/modules/echo-session",
    "source/modules/echo-module-tools",
    "source/modules/echo-module-shell",
    "source/modules/echo-protocol",
    "source/modules/echo-module-federation",
    "source/modules/echo-agent",
    "source/modules/echo-config",
    "source/test/utils",
    "source/modules/core",
    "source/modules/echo-module-adapter",
    "source/modules/echo-module-provider-llm",
    "source/modules/echo-module-skills",
    "source/modules/echo-module-federation",
    "source/modules/echo-module-loop",
    "source/modules/echo-module-self-update",
    "source/modules/echo-module-sanitize",
    "source/modules/echo-module-shell",
    "source/modules/echo-module-session",
    "source/modules/echo-module-transcript",
    "source/modules/echo-module-management",
    "source/modules/echo-module-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/EchoLab-Auto/EchoAgentCore"

# Faster test builds (cheap to compile, noticeably faster test runs).
[profile.test]
opt-level = 1

# Release 产物体积（2026-10 实测）。
#
# 基线：`target/release/echo-agent-core` = 24,910,840 B（23.76 MiB）。其中
# `.text` 13.3 MiB（代码本体），其余 ~10.4 MiB 主要是 **`.symtab`/`.strtab`
# 符号表**——release 默认 `debug = 0` 本就不产生 `.debug_*`，所以"剥调试信息"
# 几乎无效（实测 `strip --strip-debug` 只省 840 KB ≈ 3%）。
#
# 实测三档（同一二进制上直接跑 strip 验证）：
#   strip = "none"       24,910,840 B  23.76 MiB   （带符号表）
#   strip = "debuginfo"  24,070,520 B  22.96 MiB   （-0.8 MiB，几乎无用）
#   strip = "symbols"    18,394,632 B  17.54 MiB   （-6.5 MiB，-26.2% ← 采用）
#
# 选 `symbols`：安装器与自更新每次都要复制 + 滚动备份该二进制
# （`~/.local/libexec/echo-agent-core/echo-agent-core-bin` 与 `.bak-*`），
# 6.5 MiB 的差额在每次更新时都白付；updater 的下载/替换也更快。
#
# 代价与补偿（重要）：
# - panic 的 **消息与源码位置仍在**（`panic!` 的 file:line 是 `.rodata` 里的
#   字符串，不受影响），丢的是 backtrace 里的**函数名**（只剩地址）；
# - 需要函数名排障时，用下面这行临时重建一个带符号的二进制即可（不进仓库）：
#     cargo build --release -p echo-agent-core \
#       --config 'profile.release.strip="none"'
# - 不引入 LTO / codegen-units=1：updater 每次都要跑 `cargo build --release`，
#   加 LTO 会把每次更新拉长数分钟，与体积收益不划算。
[profile.release]
strip = "symbols"

[workspace.dependencies]
echo-defs = { path = "source/modules/echo-defs" }
echo-config = { path = "source/modules/echo-config" }
echo-context = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.15.0" }
echo-session = { path = "source/modules/echo-session" }

echo-protocol = { path = "source/modules/echo-protocol" }
echo-agent = { path = "source/modules/echo-agent" }
echo-test-utils = { path = "source/test/utils" }
echo-module = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.15.0" }
echo-module-api = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.15.0" }
echo-module-host = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.15.0" }
echo-module-adapter = { path = "source/modules/echo-module-adapter" }
echo-module-loader = { git = "https://github.com/EchoLab-Auto/echo-fabric-arch", tag = "v0.15.0" }
echo-module-provider-llm = { path = "source/modules/echo-module-provider-llm" }
echo-module-skills = { path = "source/modules/echo-module-skills" }
echo-module-federation = { path = "source/modules/echo-module-federation" }
echo-module-loop = { path = "source/modules/echo-module-loop" }
echo-module-self-update = { path = "source/modules/echo-module-self-update" }
echo-module-sanitize = { path = "source/modules/echo-module-sanitize" }
echo-module-shell = { path = "source/modules/echo-module-shell" }
echo-module-subagent = { git = "https://github.com/EchoLab-Auto/agent-module-subagent", branch = "main" }
# 工作区会话模块已迁出为独立仓库 crate-workspace（业务逻辑全在那边，
# Core 只做通用接线）；crate 名保持 echo-module-workspace 不变。
echo-module-workspace = { git = "https://github.com/EchoLab-Auto/crate-workspace", branch = "main" }
echo-module-management = { path = "source/modules/echo-module-management" }
echo-module-panel = { git = "https://github.com/EchoLab-Auto/EchoAgentPanel", branch = "main" }
echo-module-session = { path = "source/modules/echo-module-session" }
echo-module-transcript = { path = "source/modules/echo-module-transcript" }
echo-module-tools = { path = "source/modules/echo-module-tools" }

# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# config
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# concurrency / misc
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# agent framework
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
# 日志归档压缩（日志轮转器用；纯 Rust 后端，无系统 zlib 依赖）。
flate2 = "1"
sha2 = "0.10"
walkdir = "2"
regex = "1"
aho-corasick = "1"

# Subagent 独立仓以 git 依赖引用 Core 基础 crate；宿主必须将其实例
# 重定向至当前工作区，避免 path 与 git 各生成一份 trait 类型。
[patch."https://github.com/EchoLab-Auto/EchoAgentCore"]
echo-module-tools = { path = "source/modules/echo-module-tools" }
echo-module-shell = { path = "source/modules/echo-module-shell" }
echo-module-federation = { path = "source/modules/echo-module-federation" }
echo-defs = { path = "source/modules/echo-defs" }
echo-protocol = { path = "source/modules/echo-protocol" }
