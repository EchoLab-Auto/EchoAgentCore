[workspace]
resolver = "2"
members = [
    "source/defs/echo-defs",
    "source/context/echo-context",
    "source/session/echo-session",
    "source/loop/echo-loop",
    "source/llm/echo-llm-openai",
    "source/llm/echo-llm-anthropic",
    "source/llm/echo-llm-ollama",
    "source/protocol/echo-protocol",
    "source/backend/echo-core",
    "source/backend/echo-server",
    "source/backend/echo-agent",
    "source/backend/echo-adapter",
    "source/backend/echo-adapter-qq",
    "source/backend/echo-test-utils",
    "source/core",
    "source/plugin/echo-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://gitlab.com/echo_tech/EchoAgentCore"

# Faster test builds (cheap to compile, noticeably faster test runs).
[profile.test]
opt-level = 1

[workspace.dependencies]
# internal
echo-defs = { path = "source/defs/echo-defs" }
echo-context = { path = "source/context/echo-context" }
echo-session = { path = "source/session/echo-session" }
echo-loop = { path = "source/loop/echo-loop" }
echo-llm-openai = { path = "source/llm/echo-llm-openai" }
echo-llm-anthropic = { path = "source/llm/echo-llm-anthropic" }
echo-llm-ollama = { path = "source/llm/echo-llm-ollama" }
echo-protocol = { path = "source/protocol/echo-protocol" }
echo-adapter = { path = "source/backend/echo-adapter" }
echo-core = { path = "source/backend/echo-core" }
echo-server = { path = "source/backend/echo-server" }
echo-agent = { path = "source/backend/echo-agent" }
echo-adapter-qq = { path = "source/backend/echo-adapter-qq" }
echo-test-utils = { path = "source/backend/echo-test-utils" }
echo-plugin = { path = "source/plugin/echo-plugin" }

# async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# config
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# concurrency / misc
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# agent framework
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"
walkdir = "2"
regex = "1"
