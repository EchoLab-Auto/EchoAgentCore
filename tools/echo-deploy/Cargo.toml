[package]
name = "echo-deploy"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Offline release verification, deployment planning and isolated candidate staging"

# Deliberately independent: deployment must not resolve the running agent's git dependencies.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
