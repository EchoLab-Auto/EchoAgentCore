# 容器镜像：构建并发布 ghcr.io/echolab-auto/echo-agent-core。
#
# 触发：PR 只构建（守护 Dockerfile）；main 推送 latest；版本 tag（v*）推送对应版本 tag。
# 镜像被 npm 部署 CLI 使用（npm/echo-agent 的 compose 模板默认引用本镜像）。
name: Docker

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR（仅推送时）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 固定小写（GHCR 要求全小写；owner 含大写时自动转换不可靠）
          images: ghcr.io/echolab-auto/echo-agent-core
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # 先只出 amd64：arm64 在 QEMU 下编译 Rust release 极慢，
          # 需要时加 linux/arm64（或改用原生 arm runner）。
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
