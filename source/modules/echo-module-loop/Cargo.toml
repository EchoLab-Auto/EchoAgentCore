[package]
name = "echo-module-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "循环模块（解耦计划 Phase 3 ⑦）：loop.single 的策略声明与 loop 服务贡献"

[dependencies]
echo-defs = { workspace = true }
# 驱动本体 + 服务表：模块在 mount 里构造 `TurnRunner` 并 provide 到 `loop`。
echo-context = { workspace = true }
echo-loop = { workspace = true }
echo-module = { workspace = true }
echo-module-api = { workspace = true }
# 压缩策略：转录渲染 / 分层裁剪 / 摘要调用（词汇在 echo-session）。
echo-session = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 提供 loop 服务的测试要造一个 `llm` provider（trait 是 async 的）+ 拼配置 JSON。
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
