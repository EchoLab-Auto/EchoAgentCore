[package]
name = "echo-defs"
description = "EchoAgentCore Service Definition layer — vocabulary types and traits, zero implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
echo-context = { workspace = true }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
base64.workspace = true
tracing.workspace = true


toml = { workspace = true }
# TypeScript 绑定生成（可选）：协议里出现的策略枚举（ThinkingMode /
# ReasoningEffort）住在这里，所以生成能力也要到这里。feature 关闭时零影响。
ts-rs = { version = "12", optional = true }

[features]
ts-bindings = ["dep:ts-rs"]

[dev-dependencies]
proptest = "1"
