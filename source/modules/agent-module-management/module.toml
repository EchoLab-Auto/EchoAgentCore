# 管理面 —— 模块声明（**单一真值**：身份 + 依赖 + 提供）
#
# 代码用 `include_str!` 读这个文件构造 manifest（见 `src/lib.rs`），
# 改标题/依赖/提供的键都不必改 Rust。

id = "echo-agent.management.panel"
name = "管理面"
kind = "management"
description = "Panel management WS 桥接（合并模式下同时承接联邦入站）"
builtin = true
# 分类标签（不是能力类别）：随 Core 发布 → inner。
# 决定面板的分组，与 `kind`（决定门控作用域）正交。
tag = "inner"

# echo-agent.host.management：WS 桥接的宿主接缝，宿主注册。
requires = [
    "echo-agent.host.management",
]
