[package]
name = "agent-module-federation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "联邦执行层模块：远程工具路由表 / 代理工具 / 跨机聚合 / 跨机只读查询"

[dependencies]
# 联邦状态 DTO（FederationPeerInfo / FederatedNodeInfo / FederationLinkState）
# 的真值在 echo-protocol；本 crate 再导出，运行时（链路/路由/聚合）不受影响。
echo-protocol = { workspace = true }
echo-defs = { workspace = true }
serde.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
uuid.workspace = true
echo-context = { workspace = true }
echo-module = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# TypeScript 绑定生成：联邦状态类型已随协议搬到 `echo-protocol`，这里只转发，
# 让旧的 `agent-module-federation/ts-bindings` 开关继续有效。
ts-bindings = ["echo-protocol/ts-bindings"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
