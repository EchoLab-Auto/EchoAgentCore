[package]
name = "agent-module-federation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "联邦执行层模块：远程工具路由表 / 代理工具 / 跨机聚合 / 跨机只读查询"

[dependencies]
echo-defs = { workspace = true }
serde.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
uuid.workspace = true
echo-context = { workspace = true }
echo-module = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# TypeScript 绑定生成（可选）：联邦状态类型出现在管理面协议里（Panel 要读），
# 所以生成能力也要到这里。feature 关闭时零影响。
ts-rs = { version = "12", optional = true }

[features]
ts-bindings = ["dep:ts-rs"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
