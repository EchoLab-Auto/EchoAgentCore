[package]
name = "echo-agent-core"
description = "EchoAgentCore — agent core service: LLM agent loop + QQ adapter + management WebSocket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "echo-agent-core"
path = "src/main.rs"

[dependencies]
echo-defs.workspace = true
echo-config.workspace = true
echo-context.workspace = true
echo-session.workspace = true
agent-module-tools = { workspace = true }
agent-module-shell = { workspace = true }
agent-module-loop = { workspace = true }
echo-module = { workspace = true }
echo-module-host = { workspace = true }
agent-module-federation = { workspace = true }
echo-module-loader = { workspace = true }
agent-module-session = { workspace = true }
agent-module-prodoc = { workspace = true }
agent-module-transcript = { workspace = true }
agent-module-management = { workspace = true }
agent-module-panel = { workspace = true }
agent-module-skills = { workspace = true }
agent-module-workspace = { workspace = true }
agent-module-subagent = { workspace = true }
agent-module-provider-llm = { workspace = true }
agent-module-self-update = { workspace = true }
agent-module-sanitize = { workspace = true }
getrandom = "0.2"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# 日志：本地日期判定（按天轮转）与归档 gzip。
chrono.workspace = true
flate2.workspace = true

# 脱敏实现已归 `agent-module-sanitize`：组合根只在**测试**里直接构造
# `RegistryRedactor`（其余路径一律走模块导出的 `build`）。
[dev-dependencies]

[features]
# 导出管理面协议的 TypeScript 绑定（`dump-protocol-ts` 子命令）。
# 默认关闭：生产二进制不引入 ts-rs，也不因为它的升级而需要重建。
# Panel 仓的 `protocol.generated.ts` 由它产出（见 `scripts/sync-protocol.sh`）。
ts-bindings = ["agent-module-management/ts-bindings"]
