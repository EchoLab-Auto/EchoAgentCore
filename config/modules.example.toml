# modules.toml —— 外部模块配置示例（完整注释版）
#
# 放置位置：与 core.toml 同目录（如 ~/.config/echo-agent-core/modules.toml）。
# 文件不存在 = 外部模块特性休眠（Core 行为与不启用完全一致）。
# 详见 document/modules/module-authoring.md。

[profile]
name = "default"
# 分层组合：先按序应用每个 bundle，再按序应用 patch，最后应用本文件的行内条目。
# 同名 id 的行会被"整体替换"（不做字段级合并）。
bundles = []
patches = []

# ── 适配器模块（2026-10 适配器模块化） ──
#
# 适配器模块（如 agent-module-adapter-qq）不走本文件的静态条目：Core 按 QQ 实例
# 组装其 Hello.config（实例名 / persona / 端口分配 / 状态文件），在
# core.toml 的 [adapters.qq] 里声明：
#
#   mode = "module"
#   [adapters.qq.module]
#   command = "/path/to/agent-module-adapter-qq"
#
# 本文件面向普通（工具 / 服务）模块。

# ── 行内条目示例：echo-module-example（websearch + calculator 试点） ──
#
# [[module]]
# id = "example"
# kind = "stdio"
# name = "echo-module-example"
# command = "/home/me/.local/libexec/echo-agent-core/modules/echo-module-example/echo-module-example"
# enabled = true
# [module.config]
# # 原样透传给模块（Hello.config）
# mode = "default"

# ── 两份配置文件的分工 ────────────────────────────────────────────────
#
#   modules-base.toml   宿主自带什么：编译进 Core 的模块、顺序、默认开关。
#                       缺失时由 Core 按当前目录自动生成（全部启用，目录顺序），
#                       因此它就是"什么都不改变"的一份声明——删掉不影响行为。
#                       它的行可以被本文件覆盖（同 id 整行替换，位置不动）。
#
#   modules.toml        部署方追加什么：外部仓编译进来的模块（workspace /
#                       panel）、子进程模块，以及对基线的覆盖/配置。
#
# 两个文件同目录，装载顺序是 基线 → [profile] bundles → patches → 本文件行内。
# 只写本文件、不写基线（现在大多数部署）行为与以前一模一样。
#
# ── 内置模块的配置（`kind = "builtin"`）──
#
# 内置模块（编译进 Core 的那些）也能配：`[module.config]` 会被**按 id 原样
# 下发**给该模块的 mount 闭包（`MountContext.config`），不必改 core.toml、
# 不必改代码。内容由宿主与该模块约定，Core 只负责投递——写错键等同没写。
#
# 目前有约定的键：
#   echo-agent.management.panel  address = "127.0.0.1:8737"   # Panel 监听地址
#
#     ⚠ 只有 address 走这条路。**token 不从这里读**：模块配置会进模块清单
#     接口与日志排查面，凭证放这里等于主动泄漏（token 仍只认 core.toml /
#     环境变量）。
#
# [[module]]
# id = "echo-agent.management.panel"
# kind = "builtin"
# name = "管理面"
# [module.config]
# address = "127.0.0.1:8737"

# ── 可选的进程内 Web Panel（2026-11）──
#
# 编译进 Core ≠ 开启 Web 服务：只有显式 enabled = true 才挂载/监听。
# 与独立 echo-agent-panel 共用 echo-web-server 运行库，两种部署可并存。
# config_file 可复用现有多上游/SSH/联邦发现配置；模块里的 bind/static_dir 优先。
# 缺省仅允许 loopback；对局域网/公网开放必须 access_token_secret_file + allow_remote=true。
#
# [[module]]
# id = "echo-agent.panel.web"
# kind = "builtin"
# name = "Web Panel"
# enabled = true
# [module.config]
# bind = "127.0.0.1:8080"
# static_dir = "/home/me/.local/libexec/echo-agent-panel/web"
# config_file = "/home/me/.config/echo-agent-panel/panel.toml"
# core = "ws://127.0.0.1:3132"
# access_token_secret_file = "/home/me/.config/echo-agent-panel/token"

# ── 子进程资源限额（可选） ──
#
# 只对 kind = "stdio" 生效（进程内实现没有独立进程可限）。
# **缺省不限制**——限额是部署策略，没有普适默认值：Node / NapCat 那类模块
# 需要很大的地址空间，随手设 256 MiB 会直接起不来。
#
# 超限是**硬失败**（不是先警告）：CPU 用尽 → SIGXCPU；地址空间用尽 →
# malloc/mmap 失败；单文件超限 → 写返回 EFBIG；fd 用尽 → EMFILE；
# 进程数超限 → fork 失败。
#
# 0 会被**拒绝**（setrlimit 里 0 = 完全禁止，不是"不限制"）。
#
# [module.limits]
# cpu_seconds = 3600     # CPU 时间上限（秒）
# memory_mb = 2048       # 地址空间上限（MiB）
# file_size_mb = 256     # 单文件写入上限（MiB）
# open_files = 1024      # 打开文件描述符数（含 socket）
# processes = 64         # 子进程数（注意：RLIMIT_NPROC 按 **uid** 计，
#                        # 同 uid 的多个模块会共享这个配额，值要给得够宽）
