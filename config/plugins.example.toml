# plugins.toml —— 外部插件配置示例（完整注释版）
#
# 放置位置：与 core.toml 同目录（如 ~/.config/echo-agent-core/plugins.toml）。
# 文件不存在 = 外部插件特性休眠（Core 行为与不启用完全一致）。
# 详见 document/plugins/plugin-authoring.md。

[profile]
name = "default"
# 分层组合：先按序应用每个 bundle，再按序应用 patch，最后应用本文件的行内条目。
# 同名 id 的行会被"整体替换"（不做字段级合并）。
bundles = []
patches = []

# ── 适配器插件（2026-10 适配器插件化） ──
#
# 适配器插件（如 echo-adapter-qq）不走本文件的静态条目：Core 按 QQ 实例
# 组装其 Hello.config（实例名 / persona / 端口分配 / 状态文件），在
# core.toml 的 [adapters.qq] 里声明：
#
#   mode = "plugin"
#   [adapters.qq.plugin]
#   command = "/path/to/echo-adapter-qq"
#
# 本文件面向普通（工具 / 服务）插件。

# ── 行内条目示例：echo-plugin-example（websearch + calculator 试点） ──
#
# [[plugin]]
# id = "example"
# kind = "stdio"
# name = "echo-plugin-example"
# command = "/home/me/.local/libexec/echo-agent-core/plugins/echo-plugin-example/echo-plugin-example"
# enabled = true
# [plugin.config]
# # 原样透传给插件（Hello.config）
# mode = "default"

# ── 子进程资源限额（可选） ──
#
# 只对 kind = "stdio" 生效（进程内实现没有独立进程可限）。
# **缺省不限制**——限额是部署策略，没有普适默认值：Node / NapCat 那类插件
# 需要很大的地址空间，随手设 256 MiB 会直接起不来。
#
# 超限是**硬失败**（不是先警告）：CPU 用尽 → SIGXCPU；地址空间用尽 →
# malloc/mmap 失败；单文件超限 → 写返回 EFBIG；fd 用尽 → EMFILE；
# 进程数超限 → fork 失败。
#
# 0 会被**拒绝**（setrlimit 里 0 = 完全禁止，不是"不限制"）。
#
# [plugin.limits]
# cpu_seconds = 3600     # CPU 时间上限（秒）
# memory_mb = 2048       # 地址空间上限（MiB）
# file_size_mb = 256     # 单文件写入上限（MiB）
# open_files = 1024      # 打开文件描述符数（含 socket）
# processes = 64         # 子进程数（注意：RLIMIT_NPROC 按 **uid** 计，
#                        # 同 uid 的多个插件会共享这个配额，值要给得够宽）
