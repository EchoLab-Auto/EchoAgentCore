# EchoAgentCore 配置 — Agent 核心服务
# 复制为 config/echo-agent-core.local.toml 后按需修改。
# Panel（TUI 前端）的配置在 EchoAgentPanel 仓库的 config/echo-agent-panel.toml。

[logging]
level = "info"    # trace | debug | info | warn | error
format = "text"   # text | json
# 日志文件路径。留空 = stdout（Docker 中可用 docker logs 查看）。
log_file = ""
max_file_size_mb = 20
max_files = 5

[agent]
# DeepSeek（默认）。支持多配置存储与一键切换（Panel 的 /api 命令），保存后由 Core 持久化到本文件。
provider = "deepseek"
model = "deepseek-v4-flash"
# DeepSeek Anthropic 兼容端点
# 注意：api_key 以明文持久化在本文件，请保持文件权限 600（本仓库安装脚本默认已设置）。
# 也可改用环境变量 DEEPSEEK_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY 提供，留空此字段。
base_url = "https://api.deepseek.com/anthropic"
api_key = ""
# DeepSeek 思考模式与推理强度；默认即为 enabled + max。
thinking = "enabled"
reasoning_effort = "max"
max_tool_iterations = 1024
# 单个工具调用的外圈超时（秒），防止挂死的工具拖死整个 turn；默认 120。
# 工具自声明的超时优先（如 bash 的 timeout_secs，最长 300s），
# 此处配置仅作为无自声明超时工具的保护上限。
# tool_timeout_secs = 120
# 上下文 token 预算（trunk 按 token 裁剪）：1M × 0.8 = 800,000。
# 旧字段 memory_limit（按消息条数）已废弃，不再参与计算。
memory_limit_tokens = 800000
skills_dir = "skills"                    # 递归发现 SKILL.md，运行时自动热重载
# plugins_dir = "plugins"                  # plugin.toml 插件目录（5s 热重载）

# ── 多 agent 人格（可选）───────────────────────────────────────────────
# 每个 profile = 一个独立 Agent（独立记忆/会话文件/系统提示词）。
# 不配置此项 = 单默认 agent，行为与旧版一致。
# 前端"资源 → 插件"可浏览人格；运行时启停通过 Panel。
# [agent.teams.assistant]
# name = "通用助手"
# description = "日常问答与信息聚合"
# system_prompt = "你是通用助手，用中文回答。"
#
# [agent.teams.writer]
# name = "写作助理"
# description = "专注于文档写作"
# system_prompt = "你是资深写作教练，帮助打磨文档。"
# disabled_agents = []                  # 运行时禁用人格（重启保留）
#
# ── 人格级上下文预算（可选）─────────────────────────────────────────
# 不配置 = 继承上方全局 memory_limit_tokens / context_window_tokens。
# 每个 agent 的 trunk 独立裁剪，互不影响。最小 200 token。
# memory_limit_tokens = 400000          # 该人格的 trunk 预算
# context_window_tokens = 128000        # 该人格的模型窗口（预算按 ×0.8 封顶）
#
# [agent.teams.self-coding]
# name = "self-coding"
# description = "专注于框架自更新"
# memory_limit_tokens = 200000          # 只给这个 agent 较小的记忆预算

[plugins.system_prompt]
# 系统提示词插件：由 Core 注入，可在 Panel 顶部“系统提示词”中编辑保存。
# 留空表示不注入基础系统提示词。
text = "请你使用中文"

[adapters.qq]
# 是否启用 QQ 适配器（启动时自动连接 NapCat）。
enabled = false
# NapCat OneBot HTTP API，用于读取完整群和好友列表。
napcat_onebot_url = "http://localhost:3000"
# NapCat Docker 容器由 QQ 适配器托管：启动 QQ 适配器时自动启动 NapCat，
# 停止 QQ 适配器时自动停止 NapCat。若 Docker CLI 缺失/无权限，启动会在 Panel 中报错。
napcat_auto_start = true
napcat_auto_stop = true
# Docker Compose 文件路径（相对 Core 工作目录或绝对路径）。也可在启动失败时手动准备容器。
napcat_compose_file = "docker-compose.yml"
# 允许执行管理员命令（status/shutdown）的 QQ 号，0 表示禁用管理员命令。
owner_qq = 0
# 命令前缀。
command_prefix = "/"

# ── QQ 多实例（可选）──────────────────────────────────────────────
# 每个实例 = 一个 NapCat 容器 + 一条反向 WS 通道 + 一个 QQ 账号，互不冲突；
# 实例归属某人格（一个人格可挂多个实例）。启用了本适配器插件的 persona
# 若没有归属实例，Core 会自动建档并按空闲端口分配（端口写回下方 [...]ports）。
#
# [adapters.qq.instances.alix-two]
# persona = "alix"
# napcat_auto_start = false          # 覆盖共享默认
# [adapters.qq.instances.alix-two.ports]
# reverse_ws = 3140                  # 缺省自动分配并持久化
# onebot_http = 3010
# webui = 6100

[adapters.qq.server]
# 反向 WebSocket 监听地址，NapCat 将作为客户端连接到这里。
bind_address = "0.0.0.0:3131"
# 与 NapCat「网络配置 → WebSocket 客户端」中配置的 Token 保持一致。
# 留空表示不开启鉴权。也可通过环境变量 ECHO_ACCESS_TOKEN 覆盖。
access_token = ""
# 心跳探测间隔（秒），0 表示禁用探测。
heartbeat_interval = 30

[adapters.qq.trigger]
dm_auto_reply = true
group_at_reply = true

[adapters.qq.files]
# 接收文件：群文件上传（group_upload 通知）与私聊文件（消息 file 段）会在
# 过滤通过后下载到本机，并以本地路径（files[].path）随消息送达 agent。
# 单文件大小上限（MB）；超过则跳过下载（消息仍送达并注明原因）；0 = 回退默认 100。
max_mb = 100
# 是否接收群文件上传通知 / 私聊文件。
accept_group_upload = true
accept_private_file = true
# 保存目录；留空 = 默认数据目录（~/.local/share/echo-agent-core/downloads）。
# dir = ""

[core]
# Panel 连接用的 management WebSocket 监听地址（0.0.0.0 = 局域网可连；
# 只想本机连改 127.0.0.1）。
management_address = "0.0.0.0:3132"
# Panel 连接 Core 的 Bearer token（首装自动生成 32 字节随机 hex；
# 留空且绑非回环地址时启动会 warn 裸奔提醒）。
management_access_token = ""
# 运行区域名（agent 的「运行区域」展示名；agent 自带该属性，Panel 据此分组/
# 放置）。留空 = 回退 [federation].node_name → 主机名 → NodeId 短码。
# 区域 id 恒为本机 NodeId（echo-node.json），与显示名无关。
region_name = ""

[federation]
# Core↔Core 联邦链路（多机去中心化；详见 document/federation.md）。
# 联邦**始终开启**（无 enabled 开关）：不配 listen 时不监听、无 peer 时不连出
# （单机无网络暴露），但联邦管理面（状态/邀请/添加 peer）开箱可用。
# ⚠️ 一旦配置 listen 或 [federation.peers.*]，互信边界即生效（≈ SSH 免密）：
#    必须用 per-peer token，并用 allow_tools / allow_queries 收敛权限。
# 联邦监听地址（接受其他节点连入）；留空 = 仅连出。
# listen = "0.0.0.0:3133"
# 人类可读节点别名（可选；缺省仅 node_id，见配置同目录 echo-node.json）。
# node_name = "workstation"

# 静态对等节点（每个一节；url 留空 = 仅接受该 peer 连入）。
# 警告：联邦互信 ≈ SSH 免密——对端可按 allow_tools 白名单在本机执行工具。
# [federation.peers.gpu-box]
# url = "ws://192.168.1.20:3133"
# token = "<生成随机长串：openssl rand -hex 32>"
# allow_tools = ["*"]        # 允许对端调用的本机工具（Phase 2 生效）
# allow_subagent = true      # 接受对端 subagent 委派（Phase 3 生效）
# require_confirm = []       # 命中列表的调用需人工确认（Phase 2 生效）
